<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiji Campus Bus & Weather Dashboard</title>

    <style>
        /* ==========================================
           CSS STYLING
           This section styles the webpage.
           ========================================== */

        body {
            font-family: Arial, sans-serif;
            background-color: #e6f7ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #006699;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            width: 350px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h2 {
            color: #0077cc;
            margin-top: 0;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005fa3;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .weather-box {
            text-align: center;
        }

        .weather-box h3 {
            color: #006699;
        }

        .weather-box p {
            font-size: 18px;
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <!-- ==========================================
         Dashboard Title
         ========================================== -->

    <h1>Fiji Campus Bus & Weather Dashboard</h1>

    <div class="container">

        <!-- ==========================================
             Bus Fare Calculator
             ========================================== -->

        <div class="card">

            <h2>Bus Fare Calculator</h2>

            <label for="budget">
                Enter your Bus Fare Budget (FJD):
            </label>

            <input
                type="number"
                id="budget"
                placeholder="Example: 15.00">

            <button onclick="calculateRides()">
                Calculate Bus Rides
            </button>

            <!-- Result appears here -->
            <div id="result"></div>

        </div>

        <!-- ==========================================
             Nadi Weather Forecast
             ========================================== -->

        <div class="card weather-box">

            <h2>Today's Weather</h2>

            <h3>Nadi, Fiji</h3>

            <p>☀️ Sunny</p>

            <p><strong>Temperature:</strong> 31°C</p>

            <p><strong>Humidity:</strong> 68%</p>

            <p><strong>Chance of Rain:</strong> 10%</p>

        </div>

    </div>

    <script>

        /* ==========================================
           JavaScript Code
           Calculates the number of bus rides
           a student can afford.
           ========================================== */

        // Cost of one bus ride
        const farePerRide = 1.50;

        // Function runs when button is clicked
        function calculateRides() {

            // Get user's budget
            let budget = parseFloat(document.getElementById("budget").value);

            // Get result area
            let result = document.getElementById("result");

            // Check if input is empty or negative
            if (isNaN(budget) || budget < 0) {

                result.style.color = "red";
                result.innerHTML = "Please enter a valid positive dollar amount.";

                return;
            }

            // Calculate complete bus rides
            let rides = Math.floor(budget / farePerRide);

            // Display result
            result.style.color = "green";
            result.innerHTML =
                "You can afford <strong>" +
                rides +
                "</strong> bus ride(s).";
        }

    </script>

</body>
</html>
